<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--META-->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#09090b; --bg-2:#0c0c0f; --panel:#0f0f13; --panel-2:#15151b;
    --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.14);
    --text:#e4e4e7; --text-2:#a1a1aa; --muted:#5f5f68;
    --accent:#3b82f6; --up:#22c55e; --warn:#f59e0b; --down:#ef4444;
    --code-bg:#101015; --hover:rgba(255,255,255,.04);
    --shadow:0 8px 32px rgba(0,0,0,.55);
    --blur:saturate(160%) blur(14px); --glass:rgba(15,15,19,.72);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text); line-height:1.65; font-size:14px;
    font-family:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mono { font-family:"Geist Mono", "JetBrains Mono", ui-monospace, Consolas, monospace; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; }

  .app { display:flex; flex-direction:column; height:100vh; height:100dvh; }

  .statusbar {
    height:38px; flex-shrink:0; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:18px; padding:0 16px;
    background:var(--bg); font-size:11px;
  }
  .sb-brand { font-weight:700; font-size:12px; letter-spacing:.4px; white-space:nowrap; }
  .sb-brand .slash { color:var(--muted); }
  .sb-brand .slash i { font-style:normal; color:var(--accent); }
  .sb-ver { color:var(--muted); border:1px solid var(--border); border-radius:4px; padding:0 5px; font-size:9.5px; }
  .sb-sep { width:1px; height:14px; background:var(--border); }
  .sb-item { color:var(--muted); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .sb-item b { color:var(--text-2); font-weight:600; }
  .sb-dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .sb-links { margin-left:auto; display:flex; gap:4px; }
  .sb-link { color:var(--muted); padding:3px 10px; border:1px solid transparent; border-radius:6px; font-size:11px;
    background:transparent; cursor:pointer; }
  .sb-link:hover { color:var(--text); border-color:var(--border-2); }
  .sb-link.here { color:var(--accent); border-color:var(--accent); }

  .body { flex:1; display:flex; min-height:0; }

  .rail {
    width:198px; flex-shrink:0; border-right:1px solid var(--border);
    background:var(--bg-2); display:flex; flex-direction:column; padding:14px 10px 12px;
  }
  .new-chat {
    width:100%; border:1px solid var(--border-2); background:transparent; color:var(--text);
    border-radius:8px; padding:7px 10px; cursor:pointer; font-size:12.5px; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:7px; font-family:inherit;
    transition:border-color .15s, background .15s;
  }
  .new-chat:hover { border-color:var(--accent); background:var(--hover); }
  .new-chat svg { width:13px; height:13px; }
  .rail-label { font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:2.2px; margin:16px 8px 6px; }
  .conv-list { flex:1; overflow-y:auto; }
  .conv {
    padding:6px 9px; border-radius:6px; font-size:12px; color:var(--muted);
    cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:1px;
    border-left:2px solid transparent;
  }
  .conv:hover { color:var(--text); background:var(--hover); }
  .conv.active { color:var(--text); border-left-color:var(--accent); background:var(--hover); }
  .soon-note { font-size:10px; color:var(--muted); opacity:.75; padding:6px 8px 0; }
  .rail-foot { border-top:1px solid var(--border); padding-top:10px; margin-top:8px; }
  .quota-row { display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); padding:0 8px 5px; }
  .quota-row b { color:var(--text-2); font-weight:600; }
  .quota-bar { height:3px; border-radius:99px; background:var(--border); margin:0 8px 9px; overflow:hidden; }
  .quota-bar i { display:block; height:100%; width:0; border-radius:99px; background:var(--up); transition:width .4s, background .4s; }
  .quota-bar i.hot { background:var(--warn); }
  .quota-bar i.full { background:var(--down); }
  .anon { font-size:10px; color:var(--muted); padding:0 8px; display:flex; align-items:center; gap:6px; }
  .anon::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--up); flex-shrink:0; }

  .stream { flex:1; display:flex; flex-direction:column; min-width:0; }
  .msgs { flex:1; overflow-y:auto; padding:28px 0 10px; }
  .msg-col { max-width:720px; margin:0 auto; padding:0 22px; display:flex; flex-direction:column; gap:24px; }

  .m-user {
    align-self:flex-end; max-width:76%; font-size:13.5px; color:var(--text-2);
    display:flex; gap:9px; justify-content:flex-end;
  }
  .m-user .pfx { color:var(--accent); flex-shrink:0; font-size:13px; }
  .m-user .u-txt { border-left:2px solid var(--border-2); padding-left:12px; text-align:left; white-space:pre-wrap; }

  .m-ai { max-width:100%; }
  .ai-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .ai-mark { width:16px; height:16px; border-radius:4px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; }
  .ai-name { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; }
  .msg-text { font-size:14px; }
  .msg-text p { margin-bottom:10px; }
  .msg-text p:last-child { margin-bottom:0; }
  .msg-text ul { margin:4px 0 12px 20px; }
  .msg-text li { margin-bottom:4px; }
  .msg-text strong { color:var(--accent); font-weight:600; }
  .msg-text .ic { background:var(--code-bg); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-size:12.5px;
    font-family:"Geist Mono", Consolas, monospace; }
  .code { background:var(--code-bg); border:1px solid var(--border); border-radius:9px; padding:13px 15px;
    overflow-x:auto; margin:8px 0 12px; position:relative;
    font-family:"Geist Mono", Consolas, monospace; font-size:12.5px; line-height:1.6; }
  .code::before { content:"CODE"; position:absolute; top:7px; right:11px; font-size:8.5px; letter-spacing:2px;
    color:var(--muted); opacity:.6; }

  .fev {
    font-size:11px; color:var(--warn); border-left:2px solid var(--warn);
    padding:2px 0 2px 11px; margin:10px 0 2px;
  }
  .fev b { color:var(--text-2); font-weight:600; }

  .erow { display:flex; gap:4px; margin-top:10px; flex-wrap:wrap;
    font-family:"Geist Mono", Consolas, monospace; font-size:11px; }
  .eb { color:var(--muted); padding:1px 2px; position:relative; }
  .eb::before { content:"[ "; color:var(--border-2); }
  .eb::after { content:" ]"; color:var(--border-2); }
  .eb.key { color:var(--accent); cursor:default; }
  .eb.key:hover::before, .eb.key:hover::after { color:var(--accent); }
  .eb.ok { color:var(--up); }
  .eb.trace { color:var(--muted); cursor:pointer; }
  .eb.trace:hover { color:var(--text); }
  .eb.trace:hover::before, .eb.trace:hover::after { color:var(--text); }
  .eb .tip {
    display:none; position:absolute; bottom:calc(100% + 7px); left:8px; z-index:6;
    background:var(--panel); border:1px solid var(--border-2); border-radius:7px;
    padding:6px 10px; font-size:10.5px; white-space:nowrap; color:var(--muted);
    box-shadow:var(--shadow);
  }
  .eb.key:hover .tip { display:block; }
  .eb .tip b { color:var(--text); font-weight:600; }
  .trace-box {
    display:none; background:var(--code-bg); border:1px solid var(--border); border-radius:8px;
    margin-top:9px; padding:11px 13px; font-size:11px; line-height:1.7; overflow-x:auto;
    color:var(--text-2); white-space:pre;
  }
  .trace-box.open { display:block; }

  .notice { align-self:center; font-size:11.5px; color:var(--down); border:1px solid var(--down);
    border-radius:7px; padding:5px 13px; background:var(--panel); }
  .typing { display:inline-flex; gap:5px; padding:5px 2px; }
  .typing i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:tp 1.2s infinite; }
  .typing i:nth-child(2){ animation-delay:.2s } .typing i:nth-child(3){ animation-delay:.4s }
  @keyframes tp { 0%,60%,100%{opacity:.25} 30%{opacity:1} }
  .cur { display:inline-block; width:8px; height:15px; background:var(--accent);
    vertical-align:-2px; margin-left:2px; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 0%{opacity:1} 50%{opacity:0} 100%{opacity:1} }

  .welcome { max-width:600px; margin:9vh auto 0; text-align:center; padding:0 22px; }
  .welcome .ai-mark { width:44px; height:44px; border-radius:11px; font-size:19px; margin:0 auto 20px; }
  .welcome h2 { font-size:22px; letter-spacing:-.4px; margin-bottom:8px; font-weight:600; }
  .welcome .wline { font-size:10px; letter-spacing:2.8px; color:var(--muted); text-transform:uppercase; margin-bottom:26px; }
  .sugg { display:grid; grid-template-columns:1fr 1fr; gap:8px; text-align:left; }
  .sugg button {
    border:1px solid var(--border); background:transparent; color:var(--text-2); border-radius:8px;
    padding:10px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; text-align:left;
    transition:border-color .15s, background .15s;
  }
  .sugg button:hover { border-color:var(--accent); background:var(--hover); color:var(--text); }
  .sugg button::before { content:"> "; color:var(--accent); font-family:"Geist Mono", Consolas, monospace; }
  .sugg small { display:block; color:var(--muted); font-size:10.5px; margin-top:2px; }

  .composer-wrap { flex-shrink:0; padding:6px 22px 16px; }
  .composer {
    max-width:720px; margin:0 auto; background:var(--glass); backdrop-filter:var(--blur);
    -webkit-backdrop-filter:var(--blur); border:1px solid var(--border-2); border-radius:12px;
    padding:12px 13px 8px; box-shadow:var(--shadow); transition:border-color .15s;
  }
  .composer:focus-within { border-color:var(--accent); }
  .composer textarea {
    width:100%; border:none; background:transparent; color:var(--text); font-size:14px; font-family:inherit;
    resize:none; outline:none; height:22px; max-height:150px; line-height:22px;
  }
  .composer textarea::placeholder { color:var(--muted); }
  .c-foot { display:flex; align-items:center; gap:10px; margin-top:7px; }
  .soon {
    border:1px dashed var(--border-2); background:transparent; color:var(--muted); border-radius:5px;
    padding:2px 9px; font-size:11px; font-family:"Geist Mono", Consolas, monospace;
    letter-spacing:.3px; cursor:not-allowed; opacity:.7;
  }
  .c-hints { margin-left:auto; display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); }
  .kbd {
    border:1px solid var(--border-2); border-bottom-width:2px; border-radius:4px;
    padding:0 5px; font-size:9.5px; font-family:"Geist Mono", Consolas, monospace; color:var(--muted);
  }
  .send {
    width:30px; height:30px; border-radius:7px; border:1px solid var(--accent); background:var(--accent);
    color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:filter .15s;
  }
  .send:hover { filter:brightness(1.12); }
  .send svg { width:14px; height:14px; }
  .composer-note { max-width:720px; margin:8px auto 0; text-align:center; font-size:10px; color:var(--muted);
    font-family:"Geist Mono", Consolas, monospace; letter-spacing:.3px; }

  .engine {
    width:248px; flex-shrink:0; border-left:1px solid var(--border);
    background:var(--bg-2); display:flex; flex-direction:column; padding:14px 12px 12px; overflow-y:auto;
  }
  .eng-head { display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:2.2px;
    color:var(--text-2); text-transform:uppercase; margin-bottom:12px; }
  .eng-head i { width:7px; height:7px; border-radius:50%; background:var(--up); animation:pulse 1.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .eng-sec { font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:2.2px; margin:16px 0 7px; }
  .krow { display:flex; align-items:center; gap:8px; padding:5px 7px; border-radius:6px; font-size:11.5px; }
  .krow:hover { background:var(--hover); }
  .krow .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot.up { background:var(--up); }
  .dot.warn { background:var(--warn); animation:pulse 1.6s infinite; }
  .dot.down { background:var(--down); }
  .krow .kname { color:var(--text-2); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .krow .kname em { font-style:normal; color:var(--warn); }
  .krow .kreq { color:var(--muted); font-size:10.5px; }
  .krow.off { opacity:.45; }
  .spark { display:flex; align-items:flex-end; gap:2px; height:30px; padding:0 7px; }
  .spark i { flex:1; background:var(--accent); opacity:.7; border-radius:1px; min-height:2px; }
  .spark.amber i { background:var(--warn); }
  .spark-val { display:flex; justify-content:space-between; padding:5px 7px 0; font-size:10.5px; color:var(--muted); }
  .spark-val b { color:var(--text-2); font-weight:600; }
  .eng-foot { margin-top:auto; padding-top:14px; }
  .eng-foot a { display:block; text-align:center; font-size:11px; color:var(--muted); border:1px solid var(--border);
    border-radius:7px; padding:6px 0; transition:color .15s, border-color .15s; }
  .eng-foot a:hover { color:var(--accent); border-color:var(--accent); }

  @media (max-width: 1120px) { .engine { display:none; } }
  @media (max-width: 800px) { .rail { display:none; } .sugg { grid-template-columns:1fr; } .c-hints { display:none; } }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--border-2); }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body>
<div class="app">
  <header class="statusbar mono">
    <span class="sb-brand">AEOX <span class="slash">// <i>CHAT</i></span></span>
    <span class="sb-ver">v0.1-beta</span>
    <span class="sb-sep"></span>
    <span class="sb-item"><i class="sb-dot" style="background:var(--up)"></i><span data-i18n="sb.pool"></span> <b id="sbPool">—</b></span>
    <span class="sb-item"><span data-i18n="sb.routed"></span> <b id="sbRouted">—</b></span>
    <span class="sb-item"><span data-i18n="sb.events"></span> <b id="sbEvents">—</b></span>
    <nav class="sb-links">
      <a class="sb-link" href="/">hub</a>
      <a class="sb-link here" href="/chat">chat</a>
      <a class="sb-link" href="/engine">engine</a>
      <button class="sb-link" id="langBtn" type="button">EN</button>
    </nav>
  </header>

  <div class="body">
    <aside class="rail">
      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="chat.newChat"></span>
      </button>
      <div class="rail-label mono" data-i18n="chat.sessions"></div>
      <div class="conv-list" id="convList"></div>
      <div class="soon-note mono" data-i18n="chat.histSync"></div>
      <div class="rail-foot">
        <div class="quota-row mono"><span data-i18n="chat.quota"></span><b id="quotaNum">0/30</b></div>
        <div class="quota-bar"><i id="quotaBar"></i></div>
        <div class="anon mono" data-i18n="chat.anon"></div>
      </div>
    </aside>

    <main class="stream">
      <div class="msgs" id="msgs"><div class="msg-col" id="msgCol"></div></div>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" data-i18n-ph="chat.ph"></textarea>
          <div class="c-foot">
            <button class="soon" type="button" disabled data-i18n="chat.attach"></button>
            <div class="c-hints mono">
              <span data-i18n="chat.send"></span><span class="kbd">↵</span>
              <span data-i18n="chat.line"></span><span class="kbd">⇧↵</span>
            </div>
            <button class="send" id="sendBtn" type="button" title="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-note mono" data-i18n="chat.note"></div>
      </div>
    </main>

    <aside class="engine">
      <div class="eng-head mono"><i></i><span data-i18n="chat.engine"></span></div>
      <div class="eng-sec mono" data-i18n="chat.keypool"></div>
      <div id="pool"></div>
      <div class="eng-sec mono" data-i18n="chat.ttft"></div>
      <div class="spark" id="sparkTtft"></div>
      <div class="spark-val mono"><span data-i18n="chat.avg"></span><b id="ttftVal">—</b></div>
      <div class="eng-sec mono" data-i18n="chat.tps"></div>
      <div class="spark amber" id="sparkBurn"></div>
      <div class="spark-val mono"><span data-i18n="chat.now"></span><b id="burnVal">—</b></div>
      <div class="eng-foot">
        <a href="/engine" class="mono" data-i18n="chat.console"></a>
      </div>
    </aside>
  </div>
</div>

<script type="module" src="/assets/chat.js"></script>
</body>
</html>
